name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint & type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy src

  test:
    name: Tests (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: pip install -e ".[dev]"
      - run: pytest --cov=nyc_taxi_lake --cov-report=term-missing -m "not network and not spark"

  spark:
    name: Spark tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev,spark]"
      - run: pytest --cov=nyc_taxi_lake --cov-report=term-missing -m "spark"

  smoke:
    name: End-to-end smoke run
    runs-on: ubuntu-latest
    needs: [test, spark]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - run: pip install -e ".[spark]"
      - name: Ingest three synthetic months
        env:
          NYC_LAKE_ROOT: ${{ runner.temp }}/lake
        run: |
          nyc-lake ingest 2024-01 2024-03 --sample --sample-rows 20000
          nyc-lake ingest 2024-01 --sample --sample-rows 20000 | grep -q skipped
      - name: Clean them
        env:
          NYC_LAKE_ROOT: ${{ runner.temp }}/lake
        run: |
          nyc-lake clean 2024-01 2024-03
          test -f "$NYC_LAKE_ROOT/clean/_runs/yellow/2024-03.json"
      - name: Model them
        env:
          NYC_LAKE_ROOT: ${{ runner.temp }}/lake
        run: |
          nyc-lake model 2024-01 2024-03 --sample-zones
          test -f "$NYC_LAKE_ROOT/warehouse/_runs/yellow/2024-03.json"
