[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nyc-taxi-lake"
version = "0.1.0"
description = "Batch data lake for NYC TLC taxi trips: S3 raw zone, PySpark cleaning, Redshift star schema, data-quality alerts."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Mohammad Azam" }]
dependencies = [
  "pyarrow>=15",
  "requests>=2.31",
]

[project.optional-dependencies]
spark = ["pyspark>=3.5"]
aws = ["boto3>=1.34"]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6", "mypy>=1.10", "types-requests"]

[project.scripts]
nyc-lake = "nyc_taxi_lake.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
  "network: tests that download real TLC data (skipped in CI)",
  "spark: tests that start a local Spark session (need Java and the [spark] extra)",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
mypy_path = "src"
