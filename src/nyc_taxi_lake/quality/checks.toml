# Default data-quality suite, run by `nyc-lake quality` after each month is modelled.
#
# severity = "error" fails the run (non-zero exit, alert sent).
# severity = "warn"  is reported and alerted on, but does not fail the run.
# Rates are fractions: 0.05 means 5% of rows.

# --- Every row accounted for -------------------------------------------------------

[[check]]
kind = "row_count"
source = "raw"
target = "clean"

[[check]]
kind = "row_count"
source = "clean"
target = "fact_trips"

# Real TLC months quarantine around 1-3% of rows. A jump past 5% usually means a schema
# change upstream rather than worse driving.
[[check]]
kind = "quarantine_rate"
max = 0.05
severity = "warn"

[[check]]
kind = "quarantine_rate"
name = "quarantine_rate:hard_limit"
max = 0.20

# --- Nulls ---------------------------------------------------------------------------

[[check]]
kind = "null_rate"
table = "fact_trips"
column = "trip_id"
max = 0.0

[[check]]
kind = "null_rate"
table = "fact_trips"
column = "pickup_at"
max = 0.0

# Street-hail trips logged without a passenger count are common in recent TLC files.
[[check]]
kind = "null_rate"
table = "fact_trips"
column = "passenger_count"
max = 0.10
severity = "warn"

# --- Ranges --------------------------------------------------------------------------

[[check]]
kind = "range"
table = "fact_trips"
column = "trip_duration_s"
min = 0
max = 86400

[[check]]
kind = "range"
table = "fact_trips"
column = "total_amount"
min = 0
max = 1000
max_violation_rate = 0.001
severity = "warn"

[[check]]
kind = "range"
table = "fact_trips"
column = "trip_distance_mi"
min = 0
max = 200
max_violation_rate = 0.001
severity = "warn"

# --- Every fact key resolves to a dimension row --------------------------------------

[[check]]
kind = "referential_integrity"
table = "fact_trips"
column = "pickup_date_key"
references = "dim_date.date_key"

[[check]]
kind = "referential_integrity"
table = "fact_trips"
column = "pickup_zone_key"
references = "dim_zone.zone_key"

[[check]]
kind = "referential_integrity"
table = "fact_trips"
column = "dropoff_zone_key"
references = "dim_zone.zone_key"

[[check]]
kind = "referential_integrity"
table = "fact_trips"
column = "vendor_key"
references = "dim_vendor.vendor_key"

[[check]]
kind = "referential_integrity"
table = "fact_trips"
column = "rate_code_key"
references = "dim_rate_code.rate_code_key"

[[check]]
kind = "referential_integrity"
table = "fact_trips"
column = "payment_type_key"
references = "dim_payment_type.payment_type_key"

# --- The month is complete -----------------------------------------------------------

[[check]]
kind = "freshness"
table = "fact_trips"
column = "pickup_at"
max_gap_hours = 6
